
name: Actualizar lista AMICS desde IPFS

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-amics
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget jq

      - name: Instalar IPFS Kubo desde GitHub
        run: |
          KUBO_VERSION="v0.38.2"
          ARCHIVO="kubo_${KUBO_VERSION}_linux-amd64.tar.gz"
          URL="https://github.com/ipfs/kubo/releases/download/${KUBO_VERSION}/${ARCHIVO}"

          curl -fL --retry 3 --retry-delay 5 \
            "$URL" -o "$ARCHIVO"

          tar -xzf "$ARCHIVO"
          cd kubo
          sudo bash install.sh
          ipfs version

      - name: Inicializar nodo IPFS
        run: |
          ipfs init --profile=server

      - name: Conectar IPFS y ejecutar actualizador AMICS
        run: |
          set -e

          echo "Arrancando nodo IPFS..."

          ipfs daemon --enable-gc > ipfs-daemon.log 2>&1 &
          IPFS_PID=$!

          trap 'kill "$IPFS_PID" 2>/dev/null || true' EXIT

          echo "Esperando a que arranque el nodo..."

          for i in $(seq 1 30); do
            if ipfs swarm peers >/dev/null 2>&1; then
              echo "Nodo IPFS iniciado correctamente."
              break
            fi

            if ! kill -0 "$IPFS_PID" 2>/dev/null; then
              cat ipfs-daemon.log
              exit 1
            fi

            sleep 2
          done

          ipfs swarm peers >/dev/null 2>&1 || {
            cat ipfs-daemon.log
            echo "No se pudo iniciar el nodo IPFS."
            exit 1
          }

          echo "Esperando conexión con la red IPFS..."

          CONECTADO=0

          for i in $(seq 1 24); do
            PEERS=$(ipfs swarm peers | wc -l)

            echo "Intento $i: $PEERS peers"

            if [ "$PEERS" -gt 0 ]; then
              CONECTADO=1
              break
            fi

            sleep 10
          done

          if [ "$CONECTADO" -ne 1 ]; then
            echo "No se ha conseguido conectar con peers IPFS."
            cat ipfs-daemon.log
            exit 1
          fi

          echo "Conexión IPFS establecida."

          python3 actualizar_amics.py

      - name: Validar lista generada
        run: |
          test -s amics.m3u
          grep -q "^#EXTM3U" amics.m3u
          grep -q "^acestream://" amics.m3u
          echo "Lista AMICS validada."

      - name: Guardar cambios en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add amics.m3u

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos."
          else
            git commit -m "Actualizar lista AMICS desde IPFS"
            git push
          fi
